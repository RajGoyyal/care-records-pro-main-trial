<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Horizon Sanjeevani Clinic - HMIS</title>
    <!-- Modern Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* Theme Variables - Custom Premium Design Tokens */
        :root {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.6);
            --card-hover-border: rgba(99, 102, 241, 0.25);
            --text-color: #1e293b;
            --text-muted: #64748b;
            --shadow-color: rgba(15, 23, 42, 0.05);
            --stat-card-bg: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            --table-th-bg: #f8fafc;
            --table-td-border: #f1f5f9;
            --table-hover-bg: rgba(99, 102, 241, 0.02);
            --form-bg: rgba(255, 255, 255, 0.95);
            --form-border: #e2e8f0;
            --nav-bg: #ffffff;
            --nav-border: #e2e8f0;
            --footer-bg: #1e293b;
        }

        .theme-dark {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-hover-border: rgba(99, 102, 241, 0.45);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --stat-card-bg: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --table-th-bg: #1e293b;
            --table-td-border: #334155;
            --table-hover-bg: rgba(99, 102, 241, 0.08);
            --form-bg: rgba(30, 41, 59, 0.9);
            --form-border: #334155;
            --nav-bg: #1e293b;
            --nav-border: #334155;
            --footer-bg: #020617;
        }

        /* Modern 3D Premium Design System Stylesheet */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            background-color: var(--bg-color) !important;
            color: var(--text-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.03) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.02) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Ambient body reset for tailwind */
        body.bg-gray-100 {
            background-color: var(--bg-color) !important;
        }

        /* 3D Glassmorphic Cards */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            color: var(--text-color);
            box-shadow: 
                0 15px 35px -10px var(--shadow-color),
                0 5px 15px -5px rgba(15, 23, 42, 0.02),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 1.75rem;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        .card:hover {
            transform: translateY(-6px) scale(1.005);
            box-shadow: 
                0 30px 50px -15px rgba(99, 102, 241, 0.12),
                0 10px 20px -8px var(--shadow-color),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border-color: var(--card-hover-border);
        }

        /* Header Gradient - Vibrant Deep Mesh */
        .gradient-bg {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #4338ca 100%);
            box-shadow: 
                0 10px 30px -10px rgba(30, 27, 75, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            border-bottom: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 0 0 24px 24px;
        }

        /* 3D Tactile Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 1.35rem;
            border-radius: 14px;
            border: 1px solid transparent;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.02em;
            outline: none;
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: 1px solid #4f46e5;
            box-shadow: 
                0 4px 0 #3730a3, 
                0 8px 16px rgba(79, 70, 229, 0.25);
        }
        .btn-primary:hover {
            background: linear-gradient(180deg, #4f46e5 0%, #4338ca 100%);
            transform: translateY(1px);
            box-shadow: 
                0 3px 0 #3730a3, 
                0 6px 12px rgba(79, 70, 229, 0.3);
        }
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 
                0 0px 0 #3730a3, 
                0 2px 4px rgba(79, 70, 229, 0.15);
        }

        .btn-secondary {
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
            color: #475569;
            border: 1px solid #cbd5e1;
            box-shadow: 
                0 4px 0 #cbd5e1, 
                0 8px 16px rgba(148, 163, 184, 0.1);
        }
        .btn-secondary:hover {
            background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
            transform: translateY(1px);
            box-shadow: 
                0 3px 0 #cbd5e1, 
                0 6px 12px rgba(148, 163, 184, 0.12);
        }
        .btn-secondary:active {
            transform: translateY(4px);
            box-shadow: 
                0 0px 0 #cbd5e1, 
                0 2px 4px rgba(148, 163, 184, 0.05);
        }

        .btn-success {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            color: white;
            border: 1px solid #059669;
            box-shadow: 
                0 4px 0 #047857, 
                0 8px 16px rgba(16, 185, 129, 0.25);
        }
        .btn-success:hover {
            background: linear-gradient(180deg, #059669 0%, #047857 100%);
            transform: translateY(1px);
            box-shadow: 
                0 3px 0 #047857, 
                0 6px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-success:active {
            transform: translateY(4px);
            box-shadow: 
                0 0px 0 #047857, 
                0 2px 4px rgba(16, 185, 129, 0.15);
        }

        .btn-info {
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: 1px solid #1d4ed8;
            box-shadow: 
                0 4px 0 #1e40af, 
                0 8px 16px rgba(59, 130, 246, 0.25);
        }
        .btn-info:hover {
            background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
            transform: translateY(1px);
            box-shadow: 
                0 3px 0 #1e40af, 
                0 6px 12px rgba(59, 130, 246, 0.3);
        }
        .btn-info:active {
            transform: translateY(4px);
            box-shadow: 
                0 0px 0 #1e40af, 
                0 2px 4px rgba(59, 130, 246, 0.15);
        }

        /* Form Controls - Modern Tactile */
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--form-border);
            border-radius: 14px;
            margin-bottom: 1rem;
            background: var(--form-bg);
            box-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.02);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            color: var(--text-color);
        }
        .form-input:focus {
            outline: none;
            border-color: #6366f1;
            background: var(--form-bg);
            box-shadow: 
                0 0 0 4px rgba(99, 102, 241, 0.15),
                inset 0 2px 4px rgba(15, 23, 42, 0.01);
        }

        /* 3D Tabs */
        .tab {
            font-weight: 700;
            color: var(--text-muted);
            padding: 0.85rem 1.65rem;
            border-radius: 14px;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-right: 0.5rem;
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            transform: translateY(0);
        }
        .tab:hover {
            color: #4f46e5;
            background: rgba(99, 102, 241, 0.05);
            transform: translateY(-2px);
        }
        .tab.active {
            color: #4f46e5;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 
                0 10px 20px -5px rgba(99, 102, 241, 0.15), 
                0 4px 6px -2px rgba(99, 102, 241, 0.05),
                inset 0 -3px 0 #4f46e5;
            transform: translateY(-3px);
        }

        /* Navigation Style Reset */
        nav {
            background-color: var(--nav-bg) !important;
            border-bottom: 1px solid var(--nav-border) !important;
            transition: all 0.3s ease;
        }

        /* 3D Stat Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--stat-card-bg);
            border: 1px solid var(--card-border);
            padding: 1.75rem;
            border-radius: 20px;
            box-shadow: 
                0 10px 20px -8px var(--shadow-color),
                0 4px 6px -2px rgba(15, 23, 42, 0.03);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            border-bottom: 4px solid var(--form-border);
            text-align: center;
        }
        .stat-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 20px 30px -10px rgba(99, 102, 241, 0.15),
                0 10px 15px -5px var(--shadow-color);
            border-bottom-color: #6366f1;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #6366f1, #3b82f6);
            opacity: 0.85;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
            margin-bottom: 0.35rem;
            filter: drop-shadow(0 2px 4px rgba(79, 70, 229, 0.12));
        }
        .stat-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* Alerts - Elevated */
        .alert {
            padding: 1.25rem;
            border-radius: 16px;
            margin-bottom: 1.25rem;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }
        .alert-info {
            background: rgba(59, 130, 246, 0.08);
            color: #3b82f6;
            border-color: rgba(59, 130, 246, 0.15);
        }

        /* 3D Professional Tables */
        .table-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px var(--nav-border);
        }
        .table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .table th {
            background: var(--table-th-bg);
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            border-bottom: 2px solid var(--nav-border);
            padding: 1rem 0.85rem;
        }
        .table td {
            padding: 1.1rem 0.85rem;
            border-bottom: 1px solid var(--table-td-border);
            color: var(--text-color);
            font-size: 0.875rem;
            transition: background-color 0.2s ease, border-color 0.3s ease;
        }
        .table tr:last-child td {
            border-bottom: none;
        }
        .table tr:hover td {
            background-color: var(--table-hover-bg);
        }

        /* Badges - Sleek Pills */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.3rem 0.85rem;
            font-size: 0.75rem;
            border-radius: 9999px;
            font-weight: 700;
            box-shadow: 0 2px 4px rgba(15, 23, 42, 0.03);
            border: 1px solid transparent;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .badge-green { background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }
        .badge-blue { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
        .badge-yellow { background: #fffbeb; color: #92400e; border-color: #fde68a; }
        .badge-red { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
        .badge-pink { background: #fdf2f8; color: #be185d; border-color: #fbcfe8; }
        .badge-purple { background: #faf5ff; color: #6b21a8; border-color: #e9d5ff; }
        .badge-orange { background: #fff7ed; color: #c2410c; border-color: #ffedd5; }
        .badge-gray { background: #f8fafc; color: #475569; border-color: #e2e8f0; }

        /* Custom scrollbar to keep aesthetics consistent */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--form-border);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
        
        /* Dark Theme overrides for labels / generic details */
        .text-gray-800, .text-gray-700 { color: var(--text-color) !important; }
        .text-gray-600 { color: var(--text-muted) !important; }
        .bg-white { background-color: var(--card-bg) !important; }
        .border-gray-300 { border-color: var(--form-border) !important; }
        
        /* Footer theme */
        footer {
            background-color: var(--footer-bg) !important;
            border-top: 1px solid var(--nav-border);
            transition: background-color 0.3s ease;
        }

        /* Make the React wrapper container transparent to show the 3D canvas background underneath */
        .min-h-screen.bg-gray-100 {
            background-color: transparent !important;
        }

        /* Hide horizontal scrollbar for navigation tab pills */
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;  /* IE and Edge */
            scrollbar-width: none !important;  /* Firefox */
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- 3D Animation Background Canvas -->
    <div id="canvas-3d-container" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; opacity: 0.28; filter: blur(0.5px);"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // API utilities with fallback to localStorage
        let serverAvailable = false;
        let syncInProgress = false;
        // Configurable backend base URL (change via window.BACKEND_BASE or localStorage BACKEND_BASE)
        const BACKEND_BASE = (
            (typeof window !== 'undefined' && window.BACKEND_BASE) ||
            localStorage.getItem('BACKEND_BASE') ||
            'http://localhost:5000'
        ).replace(/\/$/, '');

        // Throttled health check (reduces rapid repeated calls)
        let lastHealthCheckTime = 0;
        let lastHealthCheckResult = false;
    const HEALTH_CHECK_MIN_INTERVAL = 5000; // 5 seconds
        const checkServerHealth = async (force = false) => {
            const now = Date.now();
            if (!force && (now - lastHealthCheckTime) < HEALTH_CHECK_MIN_INTERVAL) {
                return lastHealthCheckResult; // return cached
            }
            lastHealthCheckTime = now;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                const response = await fetch(`${BACKEND_BASE}/api/health`, { method: 'GET', signal: controller.signal });
                clearTimeout(timeoutId);
                lastHealthCheckResult = response.ok;
                return lastHealthCheckResult;
            } catch (error) {
                console.warn('Health check failed:', error.message);
                lastHealthCheckResult = false;
                return false;
            }
        };

    const apiRequest = async (url, options = {}) => {
            try {
        const response = await fetch(`${BACKEND_BASE}${url}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.warn('API request failed, using localStorage:', error);
                throw error;
            }
        };

        // Enhanced sync mechanism
        const syncOfflineDataToServer = async () => {
            if (syncInProgress) return;
            syncInProgress = true;
            
            try {
                console.log('Starting offline data sync...');
                // First process any pending patient deletions queued while offline
                try {
                    const pendingDeletes = loadFromStorage('deleted_usns', []);
                    if (serverAvailable && Array.isArray(pendingDeletes) && pendingDeletes.length > 0) {
                        const remaining = [];
                        for (const usn of pendingDeletes) {
                            try {
                                await apiRequest(`/api/patients/${encodeURIComponent(usn)}`, { method: 'DELETE' });
                                console.log(`Deleted patient ${usn} on server`);
                            } catch (e) {
                                console.warn(`Failed to delete patient ${usn} on server; will retry later`, e);
                                remaining.push(usn);
                            }
                        }
                        saveToStorage('deleted_usns', remaining);
                    }
                } catch (e) { console.warn('Error processing pending deletions', e); }
                
                // Get all offline data and create backup
                const offlinePatients = loadFromStorage('patients', []);
                const offlineVitals = loadFromStorage('vitals', []);
                const offlinePrescriptions = loadFromStorage('prescriptions', []);
                const offlineCaseReports = loadFromStorage('caseReports', []);
                const offlineSickIntimations = loadFromStorage('sickIntimations', []);
                const offlineTreatmentRefusals = ensureArray(loadFromStorage('treatmentRefusals', []));
                const offlineReferrals = ensureArray(loadFromStorage('referrals', []));

                // Create backup before sync
                if (offlinePatients.length > 0 || offlineVitals.length > 0 || offlinePrescriptions.length > 0 || 
                    offlineCaseReports.length > 0 || offlineSickIntimations.length > 0 || offlineTreatmentRefusals.length > 0 || offlineReferrals.length > 0) {
                    console.log('Creating backup of offline data...');
                    saveToStorage('backup_patients', offlinePatients);
                    saveToStorage('backup_vitals', offlineVitals);
                    saveToStorage('backup_prescriptions', offlinePrescriptions);
                    saveToStorage('backup_caseReports', offlineCaseReports);
                    saveToStorage('backup_sickIntimations', offlineSickIntimations);
                    saveToStorage('backup_treatmentRefusals', offlineTreatmentRefusals);
                    saveToStorage('backup_referrals', offlineReferrals);
                    saveToStorage('backup_timestamp', new Date().toISOString());
                }

                let syncResults = {
                    patients: { synced: 0, total: 0 },
                    vitals: { synced: 0, total: 0 },
                    prescriptions: { synced: 0, total: 0 },
                    caseReports: { synced: 0, total: 0 },
                    sickIntimations: { synced: 0, total: 0 },
                    treatmentRefusals: { synced: 0, total: 0 },
                    referrals: { synced: 0, total: 0 }
                };

                // Bulk sync patients
                                if (offlinePatients.length > 0) {
                    try {
                                                // Normalize patients to avoid NULLs on NOT NULL DB columns
                                                const normalizedPatients = offlinePatients
                                                    .map(p => {
                                                        const usn = (p.usn ?? '').toString().trim();
                                                        const fullName = (p.fullName ?? p.full_name ?? '').toString().trim();
                                                        const ageNum = Number(p.age);
                                                        const age = Number.isFinite(ageNum) ? ageNum : 0;
                                                        const gender = (p.gender ?? 'Unknown').toString().trim() || 'Unknown';
                                                        const phone = ((p.contact ?? p.phone ?? '') + '').trim();
                                                        const address = ((p.address ?? '') + '').trim();
                                                        return { ...p, usn, fullName, age, gender, contact: phone, phone, address };
                                                    })
                                                    // Skip clearly invalid entries missing identifiers
                                                    .filter(p => p.usn && p.fullName);

                                                const result = await apiRequest('/api/sync/patients', {
                            method: 'POST',
                                                        body: JSON.stringify(normalizedPatients)
                        });
                        syncResults.patients = {
                            synced: result.synced_count,
                            total: result.total_received
                        };
                        console.log(`Bulk synced ${result.synced_count}/${result.total_received} patients`);
                    } catch (error) {
                        console.warn('Failed to bulk sync patients:', error);
                        // Fallback to individual sync
                                                for (const raw of offlinePatients) {
                                                        const patient = (() => {
                                                                const usn = (raw.usn ?? '').toString().trim();
                                                                const fullName = (raw.fullName ?? raw.full_name ?? '').toString().trim();
                                                                const ageNum = Number(raw.age);
                                                                const age = Number.isFinite(ageNum) ? ageNum : 0;
                                                                const gender = (raw.gender ?? 'Unknown').toString().trim() || 'Unknown';
                                                                const phone = ((raw.contact ?? raw.phone ?? '') + '').trim();
                                                                const address = ((raw.address ?? '') + '').trim();
                                                                return { ...raw, usn, fullName, age, gender, contact: phone, phone, address };
                                                        })();
                            try {
                                await apiRequest('/api/patients', {
                                    method: 'POST',
                                    body: JSON.stringify(patient)
                                });
                                syncResults.patients.synced++;
                            } catch (err) {
                                console.warn(`Failed to sync patient ${patient.fullName}:`, err);
                            }
                        }
                        syncResults.patients.total = offlinePatients.length;
                    }
                }

                // Bulk sync vitals
                if (offlineVitals.length > 0) {
                    try {
                        const result = await apiRequest('/api/sync/vitals', {
                            method: 'POST',
                            body: JSON.stringify(offlineVitals)
                        });
                        syncResults.vitals = {
                            synced: result.synced_count,
                            total: result.total_received
                        };
                        console.log(`Bulk synced ${result.synced_count}/${result.total_received} vitals`);
                    } catch (error) {
                        console.warn('Failed to bulk sync vitals:', error);
                        // Fallback to individual sync
                        for (const vital of offlineVitals) {
                            try {
                                await apiRequest('/api/vitals', {
                                    method: 'POST',
                                    body: JSON.stringify(vital)
                                });
                                syncResults.vitals.synced++;
                            } catch (err) {
                                console.warn(`Failed to sync vitals for USN ${vital.usn}:`, err);
                            }
                        }
                        syncResults.vitals.total = offlineVitals.length;
                    }
                }

        };

        const ensureArray = (value) => {
            if (Array.isArray(value)) {
                return value.filter(item => item !== null && item !== undefined);
            }
            if (value && typeof value === 'object') {
                return Object.values(value).filter(item => item !== null && item !== undefined);
            }
            return [];
        };

        // Merge arrays utility - prioritizes newer data based on timestamps and local modifications
        const mergeArrays = (localArray, serverArray, keyField) => {
            const localItems = ensureArray(localArray);
            const serverItems = ensureArray(serverArray);
            const merged = [];
            const processedKeys = new Set();

            // Create a map of server items for quick lookup
            const serverMap = new Map();
            serverItems.forEach(item => {
                if (!item || item[keyField] === undefined || item[keyField] === null) return;
                serverMap.set(item[keyField], item);
            });
            
            // Get locally modified items that should not be overwritten
            const locallyModified = loadFromStorage('locallyModified_prescriptions', []);
            const recentlyModified = locallyModified.filter(id => {
                const modTime = loadFromStorage(`modTime_${id}`, 0);
                return (Date.now() - modTime) < 300000; // Extended to 5 minutes protection
            });
            
            console.log('Recently modified prescriptions (protected from server override):', recentlyModified);
            
            // Process local items first (they might have newer updates)
            localItems.forEach(localItem => {
                const key = localItem[keyField];
                const serverItem = serverMap.get(key);
                const isRecentlyModified = recentlyModified.includes(key);
                
                if (serverItem) {
                    // Both exist - check if locally modified recently
                    if (isRecentlyModified) {
                        merged.push(localItem);
                        console.log(`🛡️ PROTECTED: Local modification for ${keyField}: ${key} (recently modified locally)`);
                    } else {
                        // Additional check: if prescription status was manually changed, prioritize local
                        const isStatusChange = localItem.status !== serverItem.status && 
                                             (localItem.status === 'Completed' || localItem.status === 'Active');
                        
                        if (isStatusChange) {
                            merged.push(localItem);
                            console.log(`🔒 STATUS PROTECTION: Using local status for ${keyField}: ${key} (status: ${localItem.status})`);
                        } else {
                            // Compare timestamps to decide which is newer
                            const localTimestamp = localItem.updatedAt || localItem.prescribedAt || localItem.createdAt || 0;
                            const serverTimestamp = serverItem.updatedAt || serverItem.prescribedAt || serverItem.createdAt || 0;
                            
                            // Use local version if it's newer or if timestamps are equal (local takes precedence)
                            if (localTimestamp >= serverTimestamp) {
                                merged.push(localItem);
                                console.log(`Using local version of ${keyField}: ${key} (local: ${localTimestamp}, server: ${serverTimestamp})`);
                            } else {
                                merged.push(serverItem);
                                console.log(`Using server version of ${keyField}: ${key} (local: ${localTimestamp}, server: ${serverTimestamp})`);
                            }
                        }
                    }
                } else {
                    // Only exists locally
                    merged.push(localItem);
                }
                
                processedKeys.add(key);
            });
            
            // Add server items that don't exist locally
            serverItems.forEach(serverItem => {
                const key = serverItem[keyField];
                if (!processedKeys.has(key)) {
                    merged.push(serverItem);
                }
            });
            
            return merged;
        };

        const toBool = (value) => {
            if (typeof value === 'string') {
                const normalized = value.trim().toLowerCase();
                if (normalized === '1' || normalized === 'true' || normalized === 'yes') return true;
                if (normalized === '0' || normalized === 'false' || normalized === 'no') return false;

            return value === true || value === 1;

        const parseJsonArray = (value) => {
            if (!value && value !== 0) return [];
            if (Array.isArray(value)) return value;
            if (typeof value === 'string') {

                try {
                    const parsed = JSON.parse(trimmed);
                    return Array.isArray(parsed) ? parsed : [];
                } catch {
                    return [];

            }
            if (value && typeof value === 'object') {

                window.addEventListener('mousemove', move);
                return () => window.removeEventListener('mousemove', move);
            }, [hoverInfo]);
            
            const safePatients = patients || [];
            const safeVitals = vitals || [];
            const safePrescriptions = prescriptions || [];
            const safeCaseReports = caseReports || [];
            const safeSickIntimations = sickIntimations || [];
            const safeTreatmentRefusals = ensureArray(treatmentRefusals);
            
            // Time calculations
            const now = new Date();
            const getTimeframeDate = (timeframe) => {
                const date = new Date();
                switch(timeframe) {
                    case 'today': date.setHours(0, 0, 0, 0); break;
                    case 'week': date.setDate(date.getDate() - 7); break;
                    case 'month': date.setMonth(date.getMonth() - 1); break;
                    case 'year': date.setFullYear(date.getFullYear() - 1); break;

                return date;
            };
            
            const timeframeDate = getTimeframeDate(selectedTimeframe);
            
            // Enhanced statistics
            const stats = {
                // Patient stats
                totalPatients: safePatients.length,
                malePatients: safePatients.filter(p => p.gender === 'Male').length,
                femalePatients: safePatients.filter(p => p.gender === 'Female').length,
                averageAge: safePatients.length > 0 ? Math.round(safePatients.reduce((sum, p) => sum + (parseInt(p.age) || 0), 0) / safePatients.length) : 0,
                
                // Prescription analytics
                totalPrescriptions: safePrescriptions.length,
                criticalPrescriptions: safePrescriptions.filter(p => (p.priority || 'Normal') === 'Critical').length,
                urgentPrescriptions: safePrescriptions.filter(p => (p.priority || 'Normal') === 'Urgent').length,
                normalPrescriptions: safePrescriptions.filter(p => (p.priority || 'Normal') === 'Normal').length,
                
                // Recent activity
                recentVitals: safeVitals.filter(v => new Date(v.recordedAt) > timeframeDate).length,
                recentPrescriptions: safePrescriptions.filter(p => new Date(p.prescribedAt) > timeframeDate).length,
                recentCaseReports: safeCaseReports.filter(c => new Date(c.reportDate) > timeframeDate).length,
                recentSickLeaves: safeSickIntimations.filter(s => new Date(s.intimationDate || s.issueDate || s.createdAt) > timeframeDate).length,
                recentTreatmentRefusals: safeTreatmentRefusals.filter(r => new Date(r.refusalDate || r.createdAt) > timeframeDate).length,
                
                // Health indicators
                highBPCount: safeVitals.filter(v => {
                    const systolic = parseInt(v.bloodPressure?.split('/')[0]) || 0;
                    return systolic > 140;
                }).length,
                
                // Age distribution
                ageGroups: {
                    '0-18': safePatients.filter(p => parseInt(p.age) <= 18).length,
                    '19-35': safePatients.filter(p => parseInt(p.age) > 18 && parseInt(p.age) <= 35).length,
                    '36-55': safePatients.filter(p => parseInt(p.age) > 35 && parseInt(p.age) <= 55).length,
                    '55+': safePatients.filter(p => parseInt(p.age) > 55).length,
                },
                
                // Common diagnoses
                commonDiagnoses: safePrescriptions.reduce((acc, p) => {
                    const diagnosis = p.diagnosis || 'Unknown';
                    acc[diagnosis] = (acc[diagnosis] || 0) + 1;
                    return acc;
                }, {}),
                
                // Upcoming follow-ups
                upcomingFollowUps: safePrescriptions.filter(p => {
                    if (!p.followUpDate) return false;
                    const followUp = new Date(p.followUpDate);
                    const nextWeek = new Date();
                    nextWeek.setDate(nextWeek.getDate() + 7);
                    return followUp <= nextWeek && followUp >= now;
                }).length,

                // Consent tracking
                totalTreatmentRefusals: safeTreatmentRefusals.length
            };
            
            // Alerts and notifications
            const alerts = [
                ...(stats.criticalPrescriptions > 0 ? [{
                    type: 'critical',
                    message: `${stats.criticalPrescriptions} critical prescription${stats.criticalPrescriptions > 1 ? 's' : ''} requiring immediate attention`,
                    action: 'View Prescriptions'
                }] : []),
                ...(stats.urgentPrescriptions > 0 ? [{
                    type: 'warning',
                    message: `${stats.urgentPrescriptions} urgent prescription${stats.urgentPrescriptions > 1 ? 's' : ''} need attention`,
                    action: 'Review Urgent Cases'
                }] : []),
                ...(stats.upcomingFollowUps > 0 ? [{
                    type: 'info',
                    message: `${stats.upcomingFollowUps} follow-up${stats.upcomingFollowUps > 1 ? 's' : ''} scheduled this week`,
                    action: 'View Schedule'
                }] : []),
                ...(stats.recentTreatmentRefusals > 0 ? [{
                    type: 'info',
                    message: `${stats.recentTreatmentRefusals} new treatment refusal${stats.recentTreatmentRefusals > 1 ? 's' : ''} recorded`,
                    action: 'View Consent'
                }] : []),
                ...(stats.highBPCount > 0 ? [{
                    type: 'warning',
                    message: `${stats.highBPCount} patient${stats.highBPCount > 1 ? 's have' : ' has'} elevated blood pressure readings`,
                    action: 'Review Vitals'
                }] : [])
            ];

            // --- Chart Drawing Helpers ---
            const drawDonut3D = (canvas, slices, options = {}) => {
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                // High DPI & responsive sizing
                const containerW = Math.max(180, Math.floor(canvas.getBoundingClientRect().width) || (options.width || 260));
                const desiredW = options.width || containerW;
                const desiredH = options.height || 220;
                const dpr = window.devicePixelRatio || 1;
                if (canvas._lastW !== desiredW || canvas._lastH !== desiredH || canvas._lastDPR !== dpr) {
                    canvas.width = desiredW * dpr;
                    canvas.height = desiredH * dpr;
                    canvas.style.width = desiredW + 'px';
                    canvas.style.height = desiredH + 'px';
                    canvas._lastW = desiredW; canvas._lastH = desiredH; canvas._lastDPR = dpr;
                }
                ctx.reset?.();
                ctx.scale(dpr, dpr);
                ctx.imageSmoothingEnabled = true;
                const w = desiredW;
                const h = desiredH;
                const cx = w / 2;
                const cy = h / 2 - 5;
                const radius = Math.min(w, h) / 2 - 24;
                const thickness = options.thickness || 34;
                const depth = options.depth || 14; // pseudo 3D depth
                const total = slices.reduce((s, sl) => s + (sl.value || 0), 0) || 1;
                ctx.clearRect(0,0,w,h);

                // Animation progress
                const startTime = performance.now();
                const duration = 600; // ms

                const animate = () => {
                    const now = performance.now();
                    const t = Math.min(1, (now - startTime) / duration);
                    renderFrame(t);
                    if (t < 1) requestAnimationFrame(animate);
                };

                const renderFrame = (progress) => {
                    ctx.clearRect(0,0,w,h);
                    let startAngle = -Math.PI/2;
                    const drawn = slices.map(sl => {
                        const angleFull = (sl.value / total) * Math.PI * 2;
                        const angle = angleFull * progress;
                        const record = { ...sl, start: startAngle, end: startAngle + angle, targetEnd: startAngle + angleFull };
                        startAngle += angleFull; // for target alignment
                        return record;
                    });
                    // Draw depth
                    drawn.forEach(sl => {
                        if (sl.start === sl.end) return;
                        ctx.beginPath();
                        const gradSide = ctx.createLinearGradient(0, cy, 0, cy + depth);
                        gradSide.addColorStop(0, shadeColor(sl.color, -10));
                        gradSide.addColorStop(1, shadeColor(sl.color, -40));
                        ctx.fillStyle = gradSide;
                        ctx.moveTo(cx + Math.cos(sl.start)*radius, cy + Math.sin(sl.start)*radius + depth);
                        ctx.arc(cx, cy + depth, radius, sl.start, sl.end);
                        ctx.lineTo(cx + Math.cos(sl.end)*radius, cy + Math.sin(sl.end)*radius);
                        ctx.arc(cx, cy, radius, sl.end, sl.start, true);
                        ctx.closePath();
                        ctx.fill();
                    });
                    // Draw top slices
                    drawn.forEach(sl => {
                        if (sl.start === sl.end) return;
                        const isHover = hoverInfo && hoverInfo.id === sl.id;
                        const explode = isHover ? 6 : 0;
                        const mid = (sl.start + sl.end)/2;
                        const ox = Math.cos(mid) * explode;
                        const oy = Math.sin(mid) * explode;
                        // Gradient fill
                        const grad = ctx.createRadialGradient(cx+ox, cy+oy, radius - thickness, cx+ox, cy+oy, radius);
                        grad.addColorStop(0, shadeColor(sl.color, 25));
                        grad.addColorStop(0.6, sl.color);
                        grad.addColorStop(1, shadeColor(sl.color, -10));
                        ctx.beginPath();
                        ctx.fillStyle = grad;
                        ctx.moveTo(cx+ox, cy+oy);
                        ctx.arc(cx+ox, cy+oy, radius, sl.start, sl.end);
                        ctx.closePath();
                        ctx.fill();
                        // Cut inner hole
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.beginPath();
                        ctx.moveTo(cx+ox, cy+oy);
                        ctx.arc(cx+ox, cy+oy, radius - thickness, sl.start, sl.end);
                        ctx.closePath();
                        ctx.fill();
                        ctx.globalCompositeOperation = 'source-over';
                    });
                    // Inner outline
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                    ctx.lineWidth = 2;
                    ctx.arc(cx, cy, radius - thickness, 0, Math.PI*2);
                    ctx.stroke();
                    // Center label (dynamic if hover)
                    ctx.fillStyle = '#111827';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const lines = (hoverInfo && hoverInfo.type === options.id)
                        ? [hoverInfo.label, String(hoverInfo.value)]
                        : (options.centerText || '').split('\n');

                    if (lines.length === 2) {
                        ctx.fillText(lines[0], cx, cy - 9);
                        ctx.font = '700 17px system-ui';
                        ctx.fillText(lines[1], cx, cy + 10);
                    } else {
                        ctx.fillText(lines.join(' '), cx, cy);
                    }
                    // Metadata for hover detection
                    canvas._slicesMeta = drawn.map(sl => ({
                        id: sl.id,
                        label: sl.label,
                        value: sl.value,
                        start: sl.start,
                        end: sl.end,
                        cx, cy, radius, inner: radius - thickness, color: sl.color
                    }));
                };
                animate();
            };

            const shadeColor = (col, amt) => {
                // Simple shade/brighten hex
                try {
                    let usePound = false;
                    if (col[0] === '#') { col = col.slice(1); usePound = true; }
                    const num = parseInt(col,16);
                    let r = (num >> 16) + amt; r = Math.max(Math.min(255,r),0);
                    let g = ((num >> 8) & 0x00FF) + amt; g = Math.max(Math.min(255,g),0);
                    let b = (num & 0x0000FF) + amt; b = Math.max(Math.min(255,b),0);
                    return (usePound?'#':'#') + (r.toString(16).padStart(2,'0')) + (g.toString(16).padStart(2,'0')) + (b.toString(16).padStart(2,'0'));
                } catch { return col; }
            };

            // Prepare slice data
            // Bar chart for age distribution
            const drawAgeBars = (canvas, groups) => {
                if(!canvas) return; const ctx = canvas.getContext('2d');
                const containerW = Math.max(240, Math.floor(canvas.getBoundingClientRect().width) || 300);
                const desiredW = containerW; const desiredH = 200; const dpr = window.devicePixelRatio || 1;
                if (canvas._lastW !== desiredW || canvas._lastH !== desiredH || canvas._lastDPR !== dpr) {
                    canvas.width = desiredW * dpr; canvas.height = desiredH * dpr; canvas.style.width = desiredW+'px'; canvas.style.height = desiredH+'px';
                    canvas._lastW = desiredW; canvas._lastH = desiredH; canvas._lastDPR = dpr;
                }
                ctx.reset?.(); ctx.scale(dpr,dpr); ctx.imageSmoothingEnabled=true;
                const w = desiredW; const h = desiredH; ctx.clearRect(0,0,w,h);
                const labels = Object.keys(groups); const values = labels.map(l=>groups[l]);
                const max = Math.max(1, ...values);
                const barH = 24; const gap = 10; const chartHeight = labels.length * (barH + gap) - gap; const startY = (h - chartHeight)/2;
                ctx.font = '12px system-ui'; ctx.textBaseline='middle';
                const start = performance.now(); const dur = 500;
                const animate = () => { const t=Math.min(1,(performance.now()-start)/dur); render(t); if(t<1) requestAnimationFrame(animate); };
                const render=(prog)=>{ ctx.clearRect(0,0,w,h); labels.forEach((lab,i)=>{ const val=values[i]; const pct=val/max; const barW=(w-120)*pct*prog; const y=startY + i*(barH+gap);
                    ctx.fillStyle='#e5e7eb'; ctx.fillRect(100,y,w-120,barH);
                    const grad = ctx.createLinearGradient(100,y,100+barW,y+barH);
                    grad.addColorStop(0,'#6366f1'); grad.addColorStop(1,'#3b82f6');
                    ctx.fillStyle=grad; ctx.fillRect(100,y,barW,barH);
                    ctx.fillStyle='#374151'; ctx.fillText(lab,10,y+barH/2);
                    ctx.fillStyle='#111827'; ctx.font='600 12px system-ui'; ctx.fillText(val.toString(), 110+barW, y+barH/2); ctx.font='12px system-ui'; }); };
                animate();
            };
            // Line chart for follow-ups next 7 days
            const drawFollowUpTimeline = (canvas, dataPoints) => {
                if(!canvas) return; const ctx = canvas.getContext('2d');
                const containerW = Math.max(240, Math.floor(canvas.getBoundingClientRect().width) || 300);
                const desiredW = containerW; const desiredH = 200; const dpr = window.devicePixelRatio || 1;
                if (canvas._lastW !== desiredW || canvas._lastH !== desiredH || canvas._lastDPR !== dpr) {
                    canvas.width = desiredW * dpr; canvas.height = desiredH * dpr; canvas.style.width = desiredW+'px'; canvas.style.height = desiredH+'px';
                    canvas._lastW = desiredW; canvas._lastH = desiredH; canvas._lastDPR = dpr;
                }
                ctx.reset?.(); ctx.scale(dpr,dpr); ctx.imageSmoothingEnabled=true;
                const w = desiredW; const h = desiredH; ctx.clearRect(0,0,w,h);
                if(dataPoints.length===0) return; const max=Math.max(1,...dataPoints.map(d=>d.count)); const pad=30; const innerW=w-pad*2; const innerH=h-pad*2;
                const start=performance.now(); const dur=600;
                const animate=()=>{ const t=Math.min(1,(performance.now()-start)/dur); render(t); if(t<1) requestAnimationFrame(animate); };
                const render=(prog)=>{ ctx.clearRect(0,0,w,h); ctx.strokeStyle='#d1d5db'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(pad,h-pad); ctx.lineTo(w-pad,h-pad); ctx.moveTo(pad,h-pad); ctx.lineTo(pad,pad); ctx.stroke();
                    const stepX = innerW/(dataPoints.length-1 || 1); ctx.beginPath(); dataPoints.forEach((pt,i)=>{ const x=pad+i*stepX; const y=h-pad - (pt.count/max)*innerH*prog; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }); ctx.strokeStyle='#2563eb'; ctx.lineWidth=2; ctx.stroke();
                    dataPoints.forEach((pt,i)=>{ const x=pad+i*stepX; const y=h-pad - (pt.count/max)*innerH*prog; const grad=ctx.createRadialGradient(x,y,0,x,y,6); grad.addColorStop(0,'#fff'); grad.addColorStop(1,'#2563eb'); ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#111827'; ctx.font='10px system-ui'; ctx.textAlign='center'; ctx.fillText(pt.count.toString(), x, y-12); ctx.save(); ctx.translate(x, h-pad+12); ctx.rotate(-Math.PI/6); ctx.fillStyle='#374151'; ctx.fillText(pt.label,0,0); ctx.restore(); }); };
                animate();
            };

            const genderSlices = [
                { id:'male', label:'Male', value: stats.malePatients, color:'#3b82f6' },
                { id:'female', label:'Female', value: stats.femalePatients, color:'#ec4899' },
                { id:'other', label:'Other', value: stats.totalPatients - stats.malePatients - stats.femalePatients, color:'#6366f1' }
            ].filter(s => s.value > 0);
            const prioritySlices = [
                { id:'critical', label:'Critical', value: stats.criticalPrescriptions, color:'#dc2626' },
                { id:'urgent', label:'Urgent', value: stats.urgentPrescriptions, color:'#f59e0b' },
                { id:'normal', label:'Normal', value: stats.normalPrescriptions, color:'#10b981' }
            ].filter(s => s.value > 0);

            const followUpMap = (() => {
                const arr=[]; for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()+i); const key=d.toISOString().slice(0,10); const count=safePrescriptions.filter(p=>p.followUpDate && p.followUpDate.slice(0,10)===key).length; arr.push({ label: d.toLocaleDateString(undefined,{month:'short', day:'numeric'}), count }); } return arr;
            })();
            // Redraw charts when stats or hover changes
            useEffect(() => {
                drawDonut3D(genderChartRef.current, genderSlices, { centerText: `Patients\n${stats.totalPatients}`, id: 'gender' });
                drawDonut3D(priorityChartRef.current, prioritySlices, { centerText: `Rx\n${stats.totalPrescriptions}`, id: 'priority' });
                drawAgeBars(ageChartRef.current, stats.ageGroups || {});
                drawFollowUpTimeline(followUpChartRef.current, followUpMap);
            }, [stats.totalPatients, stats.totalPrescriptions, genderSlices.length, prioritySlices.length, hoverInfo, Object.values(stats.ageGroups||{}).join(','), followUpMap.map(p=>p.count).join(',')]);

            const handleCanvasMove = (e, canvas, type) => {
                if (!canvas || !canvas._slicesMeta) return;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const meta = canvas._slicesMeta;
                let found = null;
                for (const sl of meta) {
                    const dx = x - sl.cx;
                    const dy = y - sl.cy;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist >= sl.inner && dist <= sl.radius) {
                        const ang = Math.atan2(dy, dx);
                        const normAng = ang < -Math.PI/2 ? ang + Math.PI*2 : ang; // adjust since start at -90°
                        if (normAng >= sl.start && normAng <= sl.end) { found = sl; break; }
                    }
                }
                if (found) setHoverInfo({ id: found.id, label: found.label, value: found.value, type }); else if (hoverInfo) setHoverInfo(null);
            };

            const renderLegend = (slices) => (
                <div className="flex flex-wrap gap-2 mt-2 text-xs">
                    {slices.map(s => (
                        <div key={s.id} className="flex items-center gap-1 bg-white/60 px-2 py-1 rounded border">
                            <span className="inline-block w-3 h-3 rounded-sm" style={{background:s.color}}></span>
                            {s.label}: {s.value}
                        </div>
                    ))}

            );

            return (
                <div className="space-y-6">
                    {/* Header with timeframe selector */}
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">NHCE Clinic Dashboard</h2>
                            <div className="text-sm text-gray-600 mt-1">
                                📅 {currentTime.toLocaleDateString('en-US', { 
                                    weekday: 'long', 
                                    year: 'numeric', 
                                    month: 'long', 
                                    day: 'numeric' 
                                })} • 🕐 {currentTime.toLocaleTimeString()}
                            </div>
                        </div>
                        <div className="flex gap-4">
                            <div className="relative">
                                <input
                                    type="text"
                                    placeholder="🔍 Quick patient search..."
                                    value={quickSearchTerm}
                                    onChange={(e) => setQuickSearchTerm(e.target.value)}
                                    onFocus={() => setShowQuickSearch(true)}
                                    onBlur={() => setTimeout(() => setShowQuickSearch(false), 200)}
                                    className="form-input w-64 text-sm"
                                />
                                {showQuickSearch && quickSearchTerm && (
                                    <div className="absolute top-full left-0 w-full bg-white border rounded shadow-lg z-10 max-h-40 overflow-y-auto">
                                        {safePatients
                                            .filter(p => 
                                                p.fullName?.toLowerCase().includes(quickSearchTerm.toLowerCase()) ||
                                                p.usn?.toLowerCase().includes(quickSearchTerm.toLowerCase())
                                            )
                                            .slice(0, 5)
                                            .map(patient => (
                                                <div key={patient.usn} className="p-2 hover:bg-gray-100 cursor-pointer text-sm">
                                                    <div className="font-medium">{patient.fullName}</div>
                                                    <div className="text-gray-500">{patient.usn} • {patient.age}y • {patient.gender}</div>
                                                </div>
                                            ))
                                        }
                                        {safePatients.filter(p => 
                                            p.fullName?.toLowerCase().includes(quickSearchTerm.toLowerCase()) ||
                                            p.usn?.toLowerCase().includes(quickSearchTerm.toLowerCase())
                                        ).length === 0 && (
                                            <div className="p-2 text-gray-500 text-sm">No patients found</div>
                                        )}
                                    </div>
                                )}
                            </div>
                            <select
                                value={selectedTimeframe}
                                onChange={(e) => setSelectedTimeframe(e.target.value)}
                                className="form-input w-32"
                            >
                                <option value="today">Today</option>
                                <option value="week">This Week</option>
                                <option value="month">This Month</option>
                                <option value="year">This Year</option>
                            </select>
                            <button
                                onClick={() => setShowAlerts(!showAlerts)}
                                className={`btn ${showAlerts ? 'btn-primary' : 'btn-secondary'}`}
                            >
                                {showAlerts ? '🔔' : '🔕'} Alerts
                            </button>
                        </div>
                    </div>

                    {/* Interactive Charts Row 1 */}

                    <div className="grid gap-6 md:grid-cols-2">
                        <div className="card relative">
                            <h3 className="text-sm font-semibold mb-2 text-gray-700">Patient Gender Distribution</h3>
                            {stats.totalPatients === 0 ? (
                                <div className="flex flex-col items-center justify-center py-12 text-center">
                                    <div className="w-14 h-14 rounded-full bg-indigo-500/10 dark:bg-indigo-500/5 flex items-center justify-center text-xl mb-3 border border-indigo-500/20 shadow-inner">👥</div>

                        <div className="card relative">

                    <div className="grid gap-6 md:grid-cols-2">

        const PatientForm = ({ patients, setPatients, selectedPatient, setSelectedPatient }) => {
            const [formData, setFormData] = useState({
                usn: '',
                fullName: '',
                age: '',
                gender: '',
                address: '',
                phone: '',
                email: ''
            });
            const [errors, setErrors] = useState({});
            const [saving, setSaving] = useState(false);

            useEffect(() => {
                if (selectedPatient) {
                    setFormData({
                        usn: selectedPatient.usn || '',
                        fullName: selectedPatient.fullName || '',
                        age: selectedPatient.age || '',
                        gender: selectedPatient.gender || '',
                        address: selectedPatient.address || '',
                        phone: selectedPatient.phone || '',
                        email: selectedPatient.email || ''
                    });
                } else {
                    setFormData({
                        usn: '', fullName: '', age: '', gender: '', address: '', phone: '', email: ''
                    });
                }
            }, [selectedPatient]);

            const validateForm = () => {
                const newErrors = {};
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const phoneRegex = /^\+?[0-9\-\s]{7,15}$/;
                if (!formData.usn?.trim()) newErrors.usn = 'USN is required';
                if (!formData.fullName?.trim()) newErrors.fullName = 'Full name is required';
                if (!formData.age || Number(formData.age) <= 0) newErrors.age = 'Valid age is required';
                if (!formData.gender) newErrors.gender = 'Gender is required';
                if (formData.email && !emailRegex.test(formData.email)) newErrors.email = 'Invalid email';
                if (formData.phone && !phoneRegex.test(formData.phone)) newErrors.phone = 'Invalid phone';

                // Unique USN check when creating new
                if (!selectedPatient && formData.usn?.trim()) {
                    const exists = (patients || []).some(p => (p.usn || '').toLowerCase() === formData.usn.trim().toLowerCase());
                    if (exists) newErrors.usn = 'USN already exists';
                }

                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
                if (errors[name]) setErrors(prev => ({ ...prev, [name]: '' }));
            };

            const resetForm = () => {
                setSelectedPatient(null);
                setFormData({ usn: '', fullName: '', age: '', gender: '', address: '', phone: '', email: '' });
                setErrors({});
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!validateForm()) return;
                setSaving(true);

                try {
                    const nowMs = Date.now();
                    const payload = {
                        usn: formData.usn.trim(),
                        fullName: formData.fullName.trim(),
                        age: Number(formData.age),
                        gender: formData.gender,
                        address: formData.address?.trim() || '',
                        phone: formData.phone?.trim() || '',
                        email: formData.email?.trim() || '',
                        // Timestamps help prevent server refresh from overwriting local edits
                        createdAt: typeof selectedPatient?.createdAt === 'number' ? selectedPatient.createdAt : (selectedPatient?.createdAt ? Date.parse(selectedPatient.createdAt) || nowMs : nowMs),
                        updatedAt: nowMs
                    };

                    let updatedList = [];
                    if (selectedPatient) {
                        // Update existing
                        updatedList = (patients || []).map(p => {
                            if (p.usn === selectedPatient.usn) {
                                return {
                                    ...p,
                                    ...payload,
                                    createdAt: typeof p.createdAt === 'number' ? p.createdAt : (p.createdAt ? Date.parse(p.createdAt) || payload.createdAt : payload.createdAt), // preserve original creation time
                                    updatedAt: nowMs
                                };
                            }
                            return p;
                        });
                    } else {
                        // Add new
                        updatedList = [ ...(patients || []), payload ];
                    }

                    setPatients(updatedList);
                    saveToStorage('patients', updatedList);

                    // Try to sync with server and inform user where it's stored
                    const wasEdit = !!selectedPatient;
                    const actionText = wasEdit ? 'updated' : 'added';
                    let synced = false;
                    try {
                        // Backend accepts POST for both create and update (INSERT OR REPLACE)
                        synced = await syncWithDatabase('patients', payload, 'POST');
                    } catch (_) { synced = false; }

                    if (synced) {
                        alert(`✅ Patient ${actionText} and synced to database successfully!`);
                    } else if (serverAvailable) {
                        alert(`❌ Patient ${actionText} locally but failed to sync. Will retry when online.`);
                    } else {
                        alert(`💾 Patient ${actionText} locally. Will sync when server is available.`);
                    }

                    resetForm();
                } finally {
                    setSaving(false);
                }
            };

            return (
                <div className="card">
                    <div className="flex items-center justify-between mb-4">
                        <h2 className="text-xl font-semibold">{selectedPatient ? 'Edit Patient' : 'Add New Patient'}</h2>
                        <div className="text-sm text-gray-500">Fields marked * are required</div>
                    </div>

                    <form onSubmit={handleSubmit}>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium mb-1">USN *</label>
                                <input
                                    type="text"
                                    name="usn"
                                    value={formData.usn}
                                    onChange={handleChange}
                                    className="form-input"
                                    placeholder="e.g., 1NH21CS001"
                                    disabled={!!selectedPatient}
                                />
                                {errors.usn && <p className="text-red-500 text-sm">{errors.usn}</p>}
                            </div>

                            <div>
                                <label className="block text-sm font-medium mb-1">Full Name *</label>
                                <input
                                    type="text"
                                    name="fullName"
                                    value={formData.fullName}
                                    onChange={handleChange}
                                    className="form-input"
                                    placeholder="Student/Staff name"
                                />
                                {errors.fullName && <p className="text-red-500 text-sm">{errors.fullName}</p>}
                            </div>

                            <div>
                                <label className="block text-sm font-medium mb-1">Age *</label>
                                <input
                                    type="number"
                                    name="age"
                                    value={formData.age}
                                    onChange={handleChange}
                                    className="form-input"
                                    min="1"
                                />
                                {errors.age && <p className="text-red-500 text-sm">{errors.age}</p>}
                            </div>

                            <div>
                                <label className="block text-sm font-medium mb-1">Gender *</label>
                                <input
                                    type="text"
                                    name="gender"
                                    value={formData.gender}
                                    onChange={handleChange}
                                    className="form-input"
                                    placeholder="e.g., Male, Female, Other"
                                />
                                {errors.gender && <p className="text-red-500 text-sm">{errors.gender}</p>}
                            </div>

                            <div className="md:col-span-2">
                                <label className="block text-sm font-medium mb-1">Address</label>
                                <input
                                    type="text"
                                    name="address"
                                    value={formData.address}
                                    onChange={handleChange}
                                    className="form-input"
                                    placeholder="Optional"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium mb-1">Phone</label>
                                <input
                                    type="tel"
                                    name="phone"
                                    value={formData.phone}
                                    onChange={handleChange}
                                    className="form-input"
                                    placeholder="Optional"
                                />
                                {errors.phone && <p className="text-red-500 text-sm">{errors.phone}</p>}

                            <div>

                                <input
                                    type="email"
                                    name="email"
                                    value={formData.email}
                                    onChange={handleChange}
                                    className="form-input"
                                    placeholder="Optional"
                                />
                                {errors.email && <p className="text-red-500 text-sm">{errors.email}</p>}
                            </div>
                        </div>

                        <div className="flex flex-wrap gap-3 mt-6">
                            <button type="submit" className="btn btn-primary" disabled={saving}>
                                {saving ? 'Saving...' : selectedPatient ? 'Update Patient' : 'Add Patient'}
                            </button>
                            {selectedPatient && (
                                <button type="button" onClick={resetForm} className="btn btn-secondary">Cancel Edit</button>
                            )}
                            <button 
                                type="button" 
                                onClick={async () => {
                                    const isHealthy = await checkServerHealth();
                                    serverAvailable = isHealthy;
                                    if (isHealthy) {
                                        alert('✅ Database connection successful!');
                                    } else {
                                        alert('❌ Database connection failed. Please ensure the Python server is running on localhost:5000');
                                    }
                                }}
                                className="btn bg-blue-500 hover:bg-blue-600 text-white"
                            >
                                🔧 Test DB Connection
                            </button>
                        </div>
                    </form>
                </div>
            );
        };

        // Vitals Form Component
        const VitalsForm = ({ patients, vitals, setVitals }) => {
            const safePatients = patients || [];
            const safeVitals = vitals || [];
            
            const [formData, setFormData] = useState({
                usn: '',
                weight: '',
                height: '',
                bloodPressureSystolic: '',
                bloodPressureDiastolic: '',
                heartRate: '',
                temperature: '',
                respiratoryRate: '',
                oxygenSaturation: '',
                notes: ''
            });
            const [errors, setErrors] = useState({});
            const [selectedPatientDetails, setSelectedPatientDetails] = useState(null);
            const [patientSearchTerm, setPatientSearchTerm] = useState('');
            const [showPatientDropdown, setShowPatientDropdown] = useState(false);

            const validateForm = () => {
                const newErrors = {};
                if (!formData.usn) newErrors.usn = 'Please select a patient';
                if (!formData.weight || formData.weight <= 0) newErrors.weight = 'Valid weight is required';
                if (!formData.height || formData.height <= 0) newErrors.height = 'Valid height is required';
                if (!formData.bloodPressureSystolic || formData.bloodPressureSystolic <= 0) newErrors.bloodPressureSystolic = 'Valid systolic BP is required';
                if (!formData.bloodPressureDiastolic || formData.bloodPressureDiastolic <= 0) newErrors.bloodPressureDiastolic = 'Valid diastolic BP is required';
                if (!formData.heartRate || formData.heartRate <= 0) newErrors.heartRate = 'Valid heart rate is required';
                if (!formData.temperature || formData.temperature <= 0) newErrors.temperature = 'Valid temperature is required';
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const calculateBMI = (weight, height) => {
                const heightInMeters = height / 100;
                return (weight / (heightInMeters * heightInMeters)).toFixed(1);
            };

            const getBMICategory = (bmi) => {
                if (bmi < 18.5) return { category: 'Underweight', color: 'text-blue-600' };
                if (bmi < 25) return { category: 'Normal', color: 'text-green-600' };
                if (bmi < 30) return { category: 'Overweight', color: 'text-yellow-600' };
                return { category: 'Obese', color: 'text-red-600' };
            };

            const getBloodPressureCategory = (systolic, diastolic) => {
                if (systolic < 120 && diastolic < 80) return { category: 'Normal', color: 'text-green-600' };
                if (systolic < 130 && diastolic < 80) return { category: 'Elevated', color: 'text-yellow-600' };
                if (systolic < 140 || diastolic < 90) return { category: 'Stage 1 Hypertension', color: 'text-orange-600' };
                return { category: 'Stage 2 Hypertension', color: 'text-red-600' };
            };

            // Vital sign suggestion ranges (simplified) based on age bands
            const getVitalSuggestions = (patient) => {
                if (!patient) return null;
                const age = parseInt(patient.age, 10);
                const genderRaw = (patient.gender || '').toString().toLowerCase();
                let heartRate = '60-100';
                let respiratoryRate = '12-20';
                let temperature = '36.1-37.2';
                let oxygenSaturation = '95-100';
                let bpRange = '90-120 / 60-80';
                let idealHeightRange = { min: 150, max: 170 }; // fallback generic

                if (age < 1) {
                    heartRate = '100-160';
                    respiratoryRate = '30-60';
                    bpRange = '70-100 / 50-65';
                    idealHeightRange = { min: 50, max: 75 }; // cm
                } else if (age < 6) {
                    heartRate = '80-120';
                    respiratoryRate = '20-30';
                    bpRange = '80-110 / 50-70';
                    idealHeightRange = { min: 75, max: 110 };
                } else if (age < 13) {
                    heartRate = '70-110';
                    respiratoryRate = '18-25';
                    bpRange = '85-115 / 55-75';
                    idealHeightRange = { min: 110, max: 150 };
                } else if (age < 18) {
                    heartRate = '60-100';
                    respiratoryRate = '12-20';
                    bpRange = '90-120 / 60-80';
                    if (genderRaw.startsWith('m')) {
                        idealHeightRange = { min: 150, max: 180 };
                    } else if (genderRaw.startsWith('f')) {
                        idealHeightRange = { min: 145, max: 170 };
                    } else {
                        idealHeightRange = { min: 145, max: 178 };
                    }
                } else { // adults 18+
                    if (genderRaw.startsWith('m')) {
                        idealHeightRange = { min: 160, max: 185 };
                    } else if (genderRaw.startsWith('f')) {
                        idealHeightRange = { min: 150, max: 175 };
                    } else {
                        idealHeightRange = { min: 155, max: 180 };
                    }
                }

                // Ideal weight range from BMI 18.5 - 24.9
                let idealWeightRange = null;
                const h = parseFloat(formData.height);
                if (h && h > 0) {
                    const hM = h / 100;
                    idealWeightRange = {
                        min: (18.5 * hM * hM).toFixed(1),
                        max: (24.9 * hM * hM).toFixed(1)
                    };
                }

                return { heartRate, respiratoryRate, temperature, oxygenSaturation, bpRange, idealWeightRange, idealHeightRange };
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!validateForm()) return;

                const vitalRecord = {
                    id: Date.now().toString(),
                    usn: formData.usn,
                    patientName: selectedPatientDetails?.fullName || '',
                    weight: parseFloat(formData.weight),
                    height: parseFloat(formData.height),
                    bmi: calculateBMI(parseFloat(formData.weight), parseFloat(formData.height)),
