                const istParts = new Intl.DateTimeFormat('en-US', {
                    timeZone: 'Asia/Kolkata',
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
                }).formatToParts(new Date());
                const part = (t) => (istParts.find(p => p.type === t) || {}).value || '';
                const prescribedAtIST = `${part('year')}-${part('month')}-${part('day')}T${part('hour')}:${part('minute')}:${part('second')}+05:30`;
                const prescriptionRecord = {
                    id: Date.now().toString(),
                    usn: formData.usn,
                    patientName: selectedPatientDetails?.fullName || '',
                    patientAge: selectedPatientDetails?.age || '',

                setPrescriptions(newPrescriptions);

                    medications: prescriptionRecord.medications,
                    notes: formData.notes,
                    followUpDate: formData.followUpDate,
                    prescribedAt: nowIso,
                    prescribedAtIST,
                    prescribedBy: 'NHCE Clinic',
                    status: 'Active',
                    patientName: selectedPatientDetails?.fullName || '',
                    patientAge: selectedPatientDetails?.age || null,
                    patientGender: selectedPatientDetails?.gender || ''
                };
                
                console.log('Attempting to sync prescription to database:', dbPrescriptionData);
                const syncResult = await syncWithDatabase('prescriptions', dbPrescriptionData);
                
                if (syncResult) {
                    console.log('Prescription synced to database successfully');
                    alert('✅ Prescription created and synced to database successfully!');
                } else {

                    notes: '',
                    followUpDate: '',

            // Filter patients based on search term
            const filteredPatients = safePatients.filter(patient => {
                if (!patientSearchTerm) return true;
                const searchLower = patientSearchTerm.toLowerCase();
                return (
                    patient.fullName.toLowerCase().includes(searchLower) ||
                    patient.usn.toLowerCase().includes(searchLower) ||
                    (patient.phone && patient.phone.includes(searchLower))

                setShowPatientDropdown(searchTerm.length > 0);

                        p.fullName.toLowerCase() === searchTerm.toLowerCase() ||

                if (val === null || val === undefined) return '';
                let str = String(val);
                if (str.includes('"')) str = str.replace(/"/g, '""');
                if (/[",\n]/.test(str)) str = `"${str}"`;
                return str;
            };

            const downloadCSV = (rows, filename, columns, headers) => {
                if (!rows || rows.length === 0) {
                    alert('No data to export');
                    return;
                }
                const headerLine = (headers || columns).map(escapeCSV).join(',');
                const dataLines = rows.map(r => columns.map(col => escapeCSV(r[col])).join(','));
                const csvContent = [headerLine, ...dataLines].join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);

                    const response = await fetch(`${BACKEND_BASE}/api/export/${endpoint}`);

                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = filename;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                        alert(`${endpoint} exported successfully from database!`);
                        success = true;
                    } else {
                        console.warn(`Database export failed for ${endpoint}, status: ${response.status}`);
                    }
                } catch (err) {
                    console.warn(`Database export failed for ${endpoint}:`, err);
                }
                if (!success) {
                    console.log(`Falling back to local shaped data for ${endpoint}`);
                    downloadCSV(shapedData, filename, columns, headers);
                    alert(`${endpoint} exported from local data (database not available)`);
                }
                return success;
            };

            // --- Shape Data ---
            const shapePatients = () => patients.map(p => ({
                usn: p.usn,

                                                                    </div>
                                                                    {refusal.followUpActions ? (
                                                                        <div className="text-xs text-gray-500 mt-1 truncate max-w-[160px]" title={refusal.followUpActions}>
                                                                            {refusal.followUpActions}

                                                        </td>

                                                                {refusal.consentAcknowledged ? 'Acknowledged' : 'Pending'}

                                                            {refusal.consentSignedName ? (
                                                                <div className="text-xs text-gray-500 mt-1">

                                            }
                                        </tbody>

                                    {normalizedTreatmentRefusals.length === 0 && (

                                            No treatment refusals recorded yet. Document a refusal to view it here.

                    )}
                </div>
            );
        };

        // Main App Component with Enhanced Debugging
        const App = () => {
            const [theme, setTheme] = useState(() => localStorage.getItem('hmis-theme') || 'light');
            const [fabOpen, setFabOpen] = useState(false);

            useEffect(() => {
                const root = document.documentElement;
                if (theme === 'dark') {
                    root.classList.add('theme-dark');
                    localStorage.setItem('hmis-theme', 'dark');

                    root.classList.remove('theme-dark');
                    localStorage.setItem('hmis-theme', 'light');
                }
            }, [theme]);

            const [patients, setPatients] = useState(() => loadFromStorage('patients', []));
            const [vitals, setVitals] = useState(() => loadFromStorage('vitals', []));
            const [prescriptions, setPrescriptions] = useState(() => loadFromStorage('prescriptions', []));
            const [caseReports, setCaseReports] = useState(() => loadFromStorage('caseReports', []));
            const [sickIntimations, setSickIntimations] = useState(() => loadFromStorage('sickIntimations', []));
            const [treatmentRefusals, setTreatmentRefusals] = useState(() =>
                ensureArray(loadFromStorage('treatmentRefusals', [])).map(normalizeTreatmentRefusalRecord)
            );
            const [referrals, setReferrals] = useState(() =>
                ensureArray(loadFromStorage('referrals', [])).map(normalizeReferralRecord)

            const [selectedPatient, setSelectedPatient] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            // Scroll to top whenever active tab changes for better UX after quick actions
            useEffect(() => {
                try {
                    const target = document.querySelector('header') || document.body;
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } catch (e) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });

            }, [activeTab]);
            const [searchTerm, setSearchTerm] = useState('');
            const [dbConnected, setDbConnected] = useState(false);
            const [syncStatus, setSyncStatus] = useState('checking');
            const [hasBackup, setHasBackup] = useState(() => {
                return localStorage.getItem('backup_timestamp') !== null;
            });

            // Debug logging
            console.log('App State:', {
                patients: patients?.length || 0,
                vitals: vitals?.length || 0,
                prescriptions: prescriptions?.length || 0,
                caseReports: caseReports?.length || 0,
                sickIntimations: sickIntimations?.length || 0,
                treatmentRefusals: treatmentRefusals?.length || 0,
                referrals: referrals?.length || 0,
                activeTab,
                dbConnected
            });

            // Function to restore backup data
            const handleRestoreBackup = () => {
                if (confirm('This will restore your backup data and overwrite current data. Continue?')) {
                    const restored = restoreBackupData();
                    if (restored) {
                        setPatients(restored.patients);
                        setVitals(restored.vitals);
                        setPrescriptions(restored.prescriptions);
                        setCaseReports(restored.caseReports || []);
                        setSickIntimations(restored.sickIntimations || []);
                        setTreatmentRefusals(ensureArray(restored.treatmentRefusals).map(normalizeTreatmentRefusalRecord));
                        setReferrals(ensureArray(restored.referrals).map(normalizeReferralRecord));
                        setHasBackup(false);
                        alert('Backup data restored successfully!');
                    }
                }
            };

            // Enhanced database connection and sync check
            useEffect(() => {
                const checkDatabaseAndSync = async () => {
                    try {
                        console.log('Checking database connection...');
                        const isOnline = await checkServerHealth();
                        console.log(`Database connection status: ${isOnline ? 'Connected' : 'Disconnected'}`);
                        
                        const wasOffline = !dbConnected && isOnline; // Detect transition from offline to online
                        setDbConnected(isOnline);
                        serverAvailable = isOnline;
                        
                        if (isOnline) {
                            setSyncStatus('connected');
                            
                            // If transitioning from offline to online, sync offline data first
                            if (wasOffline) {
                                const offlinePatients = loadFromStorage('patients', []);
                                const offlineVitals = loadFromStorage('vitals', []);
                                const offlinePrescriptions = loadFromStorage('prescriptions', []);
                                const hasOfflineData = offlinePatients.length > 0 || offlineVitals.length > 0 || offlinePrescriptions.length > 0;
                                
                                if (hasOfflineData) {
                                    console.log('Syncing offline data to server before refresh...');
                                    setSyncStatus('syncing');
                                    await syncOfflineDataToServer();
                                }
                            }
                            
                            // Now refresh data from server (this will merge server data with synced offline data)
                            try {
                                console.log('Refreshing data from server...');
                                let serverPatients = await apiRequest('/api/patients');
                                const serverVitals = await apiRequest('/api/vitals');
                                const serverPrescriptions = await apiRequest('/api/prescriptions');
                                const serverCaseReportsRaw = await apiRequest('/api/case-reports');
                                const serverSickIntimationsRaw = await apiRequest('/api/sick-intimations');
                                const serverTreatmentRefusalsRaw = await apiRequest('/api/treatment-refusals');
                                // Respect locally queued deletions to avoid reappearing entries
                                const deletedUSNs = loadFromStorage('deleted_usns', []);
                                if (Array.isArray(deletedUSNs) && deletedUSNs.length > 0) {
                                    serverPatients = (serverPatients || []).filter(p => !deletedUSNs.includes(p.usn));
                                }
                                
                                // Merge server data with any remaining local data instead of replacing
                                const mergedPatients = mergeArrays(patients, serverPatients || [], 'usn');
                                const mergedVitals = mergeArrays(vitals, serverVitals || [], 'id');
                                const mergedPrescriptions = mergeArrays(prescriptions, serverPrescriptions || [], 'id');
                                const mergedCaseReports = mergeArrays(
                                    caseReports,
                                    (serverCaseReportsRaw || []).map(mapCaseReportFromServer),
                                    'reportNumber'
                                );
                                const mergedSickIntimations = mergeArrays(
                                    sickIntimations,
                                    (serverSickIntimationsRaw || []).map(mapSickIntimationFromServer),
                                    'intimationNumber'
                                );
                                const mergedTreatmentRefusals = mergeArrays(
                                    treatmentRefusals,
                                    (serverTreatmentRefusalsRaw || []).map(mapTreatmentRefusalFromServer),
                                    'refusalNumber'
                                );
                                const normalizedMergedTreatmentRefusals = ensureArray(mergedTreatmentRefusals)
                                    .map(normalizeTreatmentRefusalRecord);
                                
                                setPatients(mergedPatients);
                                setVitals(mergedVitals);
                                setPrescriptions(mergedPrescriptions);
                                setCaseReports(mergedCaseReports);
                                setSickIntimations(mergedSickIntimations);
                                setTreatmentRefusals(normalizedMergedTreatmentRefusals);
                                
                                saveToStorage('patients', mergedPatients);
                                saveToStorage('vitals', mergedVitals);
                                saveToStorage('prescriptions', mergedPrescriptions);
                                saveToStorage('caseReports', mergedCaseReports);
                                saveToStorage('sickIntimations', mergedSickIntimations);
                                saveToStorage('treatmentRefusals', normalizedMergedTreatmentRefusals);
                                
                                setSyncStatus('synced');
                                console.log('Data refresh and merge completed');
                            } catch (error) {
                                console.warn('Failed to refresh data from server:', error);
                                setSyncStatus('connected');
                            }
                        }
                    } catch (error) {
                        console.error('Database connection check failed:', error);
                        setDbConnected(false);
                        setSyncStatus('offline');
                    }
                };
                checkDatabaseAndSync();
                const interval = setInterval(checkDatabaseAndSync, 15000); // Check every 15 seconds
                return () => clearInterval(interval);
            }, [dbConnected, patients, vitals, prescriptions]);

            // Save to localStorage whenever data changes and attempt sync
            useEffect(() => {
                saveToStorage('patients', patients);
                if (dbConnected && patients.length > 0) {
                    localStorage.setItem('needsSync', 'true');
                }
            }, [patients, dbConnected]);

            useEffect(() => {
                saveToStorage('vitals', vitals);
                if (dbConnected && vitals.length > 0) {
                    localStorage.setItem('needsSync', 'true');
                }
            }, [vitals, dbConnected]);

            useEffect(() => {
                saveToStorage('prescriptions', prescriptions);
                if (dbConnected && prescriptions.length > 0) {
                    localStorage.setItem('needsSync', 'true');
                }
            }, [prescriptions, dbConnected]);

            useEffect(() => {
                saveToStorage('caseReports', caseReports);
                if (dbConnected && caseReports.length > 0) {
                    localStorage.setItem('needsSync', 'true');
                }
            }, [caseReports, dbConnected]);

            useEffect(() => {
                saveToStorage('sickIntimations', sickIntimations);
                if (dbConnected && sickIntimations.length > 0) {
                    localStorage.setItem('needsSync', 'true');
                }
            }, [sickIntimations, dbConnected]);

            useEffect(() => {
                saveToStorage('treatmentRefusals', treatmentRefusals);
                if (dbConnected && treatmentRefusals.length > 0) {
                    localStorage.setItem('needsSync', 'true');
                }
            }, [treatmentRefusals, dbConnected]);

            const handleDeletePatient = async (usn) => {
                if (!usn) return;
                if (!confirm('Are you sure you want to delete this patient? This will also remove all associated vitals and prescriptions.')) return;
                
                // Optimistically update UI and local storage
                setPatients(prev => prev.filter(p => p.usn !== usn));
                setVitals(prev => prev.filter(v => v.usn !== usn));
                setPrescriptions(prev => prev.filter(r => r.usn !== usn));
                setCaseReports(prev => prev.filter(r => r.usn !== usn));
                setSickIntimations(prev => prev.filter(r => r.usn !== usn));
                setTreatmentRefusals(prev => ensureArray(prev).filter(r => r.usn !== usn));
                if (selectedPatient?.usn === usn) {
                    setSelectedPatient(null);
                }

                // Try to delete on server; if offline, queue for later
                let deletedOnServer = false;
                try {
                    if (serverAvailable) {
                        await apiRequest(`/api/patients/${encodeURIComponent(usn)}`, { method: 'DELETE' });
                        deletedOnServer = true;
                    }
                } catch (e) {
                    deletedOnServer = false;
                }
                const queued = loadFromStorage('deleted_usns', []);
                if (!deletedOnServer) {
                    const set = new Set(Array.isArray(queued) ? queued : []);
                    set.add(usn);
                    saveToStorage('deleted_usns', Array.from(set));
                } else {
                    // Ensure it's not in queue anymore
                    if (Array.isArray(queued) && queued.length > 0) {
                        saveToStorage('deleted_usns', queued.filter(x => x !== usn));
                    }
                }
            };

            return (
                <div className="min-h-screen bg-gray-100">
                    {/* Header */}
                    <header className="gradient-bg text-white py-8 px-4">
                        <div className="container mx-auto max-w-6xl">
                            <div className="flex justify-between items-center">
                                <div className="flex items-center">
                                    <img src="./nhce_25-scaled-1-2048x683.png" alt="NHCE Logo" className="mr-4" style={{height:'140px', maxWidth: '260px'}} />
                                    <div>
                                        <h1 className="text-3xl md:text-4xl font-bold mb-2">
                                            New Horizon Sanjeevani Clinic
                                        </h1>
                                        <p className="text-xl opacity-90">
                                            New Horizon Knowledge Park, Outer Ring Rd, near Marathalli, Kaverappa Layout, Kadubeesanahalli, Bengaluru, Karnataka - 560103.
                                        </p>
                                    </div>
                                </div>
                                <div className="text-right flex flex-col items-end gap-3">
                                    <button 
                                        onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}
                                        className="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 font-bold text-xs transition-all flex items-center gap-1.5 text-white shadow-lg active:scale-95"
                                    >
                                        {theme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode'}
                                    </button>
                                    <div className={`inline-flex items-center px-3 py-1 rounded-full text-sm font-medium ${
                                        syncStatus === 'connected' || syncStatus === 'synced' ? 'bg-green-500 text-white' :
                                        syncStatus === 'syncing' ? 'bg-yellow-500 text-white' :
                                        syncStatus === 'offline' ? 'bg-red-500 text-white' :
                                        'bg-gray-500 text-white'
                                    }`}>
                                        <div className={`w-2 h-2 rounded-full mr-2 ${
                                            syncStatus === 'connected' || syncStatus === 'synced' ? 'bg-green-300' :
                                            syncStatus === 'syncing' ? 'bg-yellow-300 animate-pulse' :
                                            syncStatus === 'offline' ? 'bg-red-300' :
                                            'bg-gray-300'
                                        }`}></div>
                                        {syncStatus === 'connected' ? 'Online' :
                                         syncStatus === 'synced' ? 'Synced' :
                                         syncStatus === 'syncing' ? 'Syncing...' :
                                         syncStatus === 'offline' ? 'Offline Mode' :
                                         'Checking...'}
                                    </div>
                                    {syncStatus === 'offline' && (
                                        <div className="mt-1">
                                            <p className="text-xs opacity-75">Data will sync when server is available</p>

                                                    console.log('Manual connection test...');
                                                    const isOnline = await checkServerHealth();
                                                    console.log('Manual test result:', isOnline);
                                                    if (isOnline) {
                                                        setSyncStatus('connected');
                                                        setDbConnected(true);
                                                        serverAvailable = true;
                                                    }
                                                }}
                                                className="text-xs bg-blue-500 hover:bg-blue-600 text-white px-2 py-1 rounded mt-1"
                                            >
                                                Test Connection
                                            </button>
                                        </div>
                                    )}
                                    {hasBackup && (
                                        <div className="mt-1">
                                            <button

                                                🔄 Restore Backup
                                            </button>

                                </div>
                            </div>

                                    Patients

                    {/* Main Content */}

                        </div>

                        {activeTab === 'dashboard' && (
                            <Dashboard 
                                patients={patients}

    <script>
        // Three.js 3D Molecular Background Animation
        (() => {
            const init3D = () => {
                if (typeof THREE === 'undefined') {
                    console.warn('Three.js is not defined. 3D molecular background animation is disabled.');
                    return;
                }
                const container = document.getElementById('canvas-3d-container');
                if (!container) return;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 28;

                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);

                // Create DNA Double Helix
                const dnaHelix = new THREE.Group();
                scene.add(dnaHelix);

                const numPoints = 40; // Number of base pairs
                const helixRadius = 4.5;
                const helixHeight = 26;
                const turns = 2.5;

                const nodeGeom = new THREE.SphereGeometry(0.3, 12, 12);
                
                // Color configuration for strands and bases
                const strandMat1 = new THREE.MeshBasicMaterial({ color: 0x6366f1, transparent: true, opacity: 0.55 }); // Indigo
                const strandMat2 = new THREE.MeshBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0.55 }); // Purple
                const baseMats = [
                    new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.6 }), // Sky
                    new THREE.MeshBasicMaterial({ color: 0xf43f5e, transparent: true, opacity: 0.6 }), // Rose
                    new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.55 }), // Emerald
                    new THREE.MeshBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.55 })  // Amber
                ];

                const strand1Spheres = [];
                const strand2Spheres = [];
                const rungPoints = [];

                for (let i = 0; i < numPoints; i++) {
                    const t = i / numPoints;
                    const angle = t * turns * Math.PI * 2;
                    const y = (t - 0.5) * helixHeight;

                    // Strand 1 Position
                    const x1 = helixRadius * Math.cos(angle);
                    const z1 = helixRadius * Math.sin(angle);

                    // Strand 2 Position (180 deg out of phase)
                    const x2 = helixRadius * Math.cos(angle + Math.PI);
                    const z2 = helixRadius * Math.sin(angle + Math.PI);

                    // Add node to Strand 1
                    const sphere1 = new THREE.Mesh(nodeGeom, strandMat1);
                    sphere1.position.set(x1, y, z1);
                    dnaHelix.add(sphere1);
                    strand1Spheres.push(sphere1);

                    // Add node to Strand 2
                    const sphere2 = new THREE.Mesh(nodeGeom, strandMat2);
                    sphere2.position.set(x2, y, z2);
                    dnaHelix.add(sphere2);
                    strand2Spheres.push(sphere2);

                    // Save line positions for connecting rungs
                    rungPoints.push(x1, y, z1);
                    rungPoints.push(x2, y, z2);

                    // Add a tiny colored base-pair junction node in the middle
                    if (i % 2 === 0) {
                        const midGeom = new THREE.SphereGeometry(0.18, 8, 8);
                        const midMesh = new THREE.Mesh(midGeom, baseMats[(i / 2) % baseMats.length]);
                        midMesh.position.set((x1 + x2) / 2, y, (z1 + z2) / 2);
                        dnaHelix.add(midMesh);
                    }
                }

                // Add line segments connecting base pairs
                const rungGeom = new THREE.BufferGeometry();
                rungGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(rungPoints), 3));
                const rungMat = new THREE.LineBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.12 });
                const rungs = new THREE.LineSegments(rungGeom, rungMat);
                dnaHelix.add(rungs);

                // Add some ambient floating background particles for depth
                const particles = new THREE.Group();
                scene.add(particles);

                const particleCount = 20;
                const partGeom = new THREE.SphereGeometry(0.18, 8, 8);
                const partMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.35 });
                const partNodes = [];

                for (let i = 0; i < particleCount; i++) {
                    const mesh = new THREE.Mesh(partGeom, partMat);
                    mesh.position.set(
                        (Math.random() - 0.5) * 40,
                        (Math.random() - 0.5) * 40,
                        (Math.random() - 0.5) * 20 - 5
                    );
                    particles.add(mesh);
                    partNodes.push({
                        mesh,
                        speedX: (Math.random() - 0.5) * 0.02,
                        speedY: (Math.random() - 0.5) * 0.02
                    });
                }

                // Tilt the DNA helix 45 degrees for a professional, dynamic look
                dnaHelix.rotation.z = Math.PI / 4;
                dnaHelix.rotation.x = 0.2;

                // Slowly animate the molecular network
                function animate() {
                    requestAnimationFrame(animate);
                    const time = Date.now() * 0.0002;
                    
                    // Rotate the tilted helix around its Y-axis
                    dnaHelix.rotation.y = time * 1.2;

                    // Pulsate individual strand nodes
                    strand1Spheres.forEach((s, idx) => {
                        const pulse = 1 + Math.sin(time * 8 + idx) * 0.15;
                        s.scale.set(pulse, pulse, pulse);
                    });
                    strand2Spheres.forEach((s, idx) => {
                        const pulse = 1 + Math.cos(time * 8 + idx) * 0.15;
                        s.scale.set(pulse, pulse, pulse);
                    });

                    // Float background particles
                    partNodes.forEach(p => {
                        p.mesh.position.x += p.speedX;
                        p.mesh.position.y += p.speedY;

                        // Wrap around bounds
                        if (Math.abs(p.mesh.position.x) > 22) p.mesh.position.x = -Math.sign(p.mesh.position.x) * 22;
                        if (Math.abs(p.mesh.position.y) > 22) p.mesh.position.y = -Math.sign(p.mesh.position.y) * 22;
                    });

                    renderer.render(scene, camera);
                }
                animate();

                // Resize handle
                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
            };

            if (document.readyState === 'loading') {
                window.addEventListener('DOMContentLoaded', init3D);
            } else {
                init3D();
            }
        })();
    </script>
