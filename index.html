<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHCE Hospital Management Information System</title>
    
    <!-- Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
        <!-- Logo -->
        <div class="text-center mb-8">
            <img src="./public/nhce_logo.png" alt="NHCE Logo" class="h-20 w-auto mx-auto mb-4">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">NHCE Hospital Management</h1>
            <p class="text-gray-600">Information System</p>
        </div>
        
        <!-- Welcome Message -->
        <div class="text-center mb-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-2">Welcome</h2>
            <p class="text-gray-600">New Horizon Sanjeevani Clinic</p>
            <p class="text-sm text-gray-500 mt-2">Quality Healthcare for NHCE Community</p>
        </div>
        
        <!-- Enter Button -->
        <div class="text-center">
            <a href="dashboard.html" 
               class="inline-block w-full bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-blue-700 transition-colors duration-200">
                Enter HMIS
            </a>
        </div>
        
        <!-- Version Info -->
        <div class="text-center mt-8 text-xs text-gray-400">
            <p>Version 2.0 - Modular Architecture</p>
            <p>Developed by LeadOnyx Apex LLP</p>
        </div>
    </div>

</html>
