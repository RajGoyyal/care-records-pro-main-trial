<!-- Patient Form Template -->
<div class="patient-form-template">
    <!-- Form Header -->
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Patient Registration</h2>
            <p class="text-gray-600">Register new patient or update existing patient information</p>
        </div>
        
        <div class="card-content">
            <!-- Patient Search -->
            <div class="form-group">
                <label for="patient-search" class="form-label">Search Existing Patient</label>
                <div class="search-input">
                    <span class="search-icon">🔍</span>
                    <input 
                        type="text" 
                        id="patient-search" 
                        class="form-input" 
                        placeholder="Search by USN, Name, or Phone..."
                        autocomplete="off"
                    >
                </div>
                <div id="search-results" class="mt-2 hidden"></div>
            </div>

            <!-- Patient Form -->
            <form id="patient-form" class="mt-6">
                <!-- Basic Information -->
                <fieldset class="mb-6">
                    <legend class="text-lg font-semibold text-gray-900 mb-4">Basic Information</legend>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="patient-usn" class="form-label required">USN</label>
                            <input 
                                type="text" 
                                id="patient-usn" 
                                name="usn"
                                class="form-input" 
                                placeholder="1NH21CS001"
                                required 
                                pattern="[1-4][A-Z]{2}[0-9]{2}[A-Z]{2,3}[0-9]{3}"
                                title="Enter valid USN format (e.g., 1NH21CS001)"
                            >
                            <span class="form-error" id="usn-error"></span>
                        </div>

                        <div class="form-group">
                            <label for="patient-name" class="form-label required">Full Name</label>
                            <input 
                                type="text" 
                                id="patient-name" 
                                name="name"
                                class="form-input" 
                                placeholder="Enter full name"
                                required
                                minlength="2"
                                maxlength="100"
                            >
                            <span class="form-error" id="name-error"></span>
                        </div>

                        <div class="form-group">
                            <label for="patient-age" class="form-label required">Age</label>
                            <input 
                                type="number" 
                                id="patient-age" 
                                name="age"
                                class="form-input" 
                                placeholder="Age"
                                required
                                min="1"
                                max="100"
                            >
                            <span class="form-error" id="age-error"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="patient-gender" class="form-label required">Gender</label>
                            <select id="patient-gender" name="gender" class="form-select" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                            <span class="form-error" id="gender-error"></span>
                        </div>

                        <div class="form-group">
                            <label for="patient-phone" class="form-label">Phone Number</label>
                            <input 
                                type="tel" 
                                id="patient-phone" 
                                name="phone"
                                class="form-input" 
                                placeholder="10-digit mobile number"
                                pattern="[6-9][0-9]{9}"
                                title="Enter valid 10-digit mobile number"
                            >
                            <span class="form-error" id="phone-error"></span>
                        </div>

                        <div class="form-group">
                            <label for="patient-email" class="form-label">Email Address</label>
                            <input 
                                type="email" 
                                id="patient-email" 
                                name="email"
                                class="form-input" 
                                placeholder="email@example.com"
                            >
                            <span class="form-error" id="email-error"></span>
                        </div>
                    </div>
                </fieldset>

                <!-- Academic Information -->
                <fieldset class="mb-6">
                    <legend class="text-lg font-semibold text-gray-900 mb-4">Academic Information</legend>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="patient-branch" class="form-label required">Branch</label>
                            <select id="patient-branch" name="branch" class="form-select" required>
                                <option value="">Select Branch</option>
                                <option value="CSE">Computer Science Engineering</option>
                                <option value="ECE">Electronics & Communication</option>
                                <option value="ME">Mechanical Engineering</option>
                                <option value="CV">Civil Engineering</option>
                                <option value="EEE">Electrical Engineering</option>
                                <option value="ISE">Information Science</option>
                                <option value="AE">Aeronautical Engineering</option>
                                <option value="BT">Biotechnology</option>
                                <option value="MBA">MBA</option>
                                <option value="MCA">MCA</option>
                            </select>
                            <span class="form-error" id="branch-error"></span>
                        </div>

                        <div class="form-group">
                            <label for="patient-year" class="form-label required">Year of Study</label>
                            <select id="patient-year" name="year" class="form-select" required>
                                <option value="">Select Year</option>
                                <option value="1">First Year</option>
                                <option value="2">Second Year</option>
                                <option value="3">Third Year</option>
                                <option value="4">Fourth Year</option>
                                <option value="PG1">PG First Year</option>
                                <option value="PG2">PG Second Year</option>
                            </select>
                            <span class="form-error" id="year-error"></span>
                        </div>

                        <div class="form-group">
                            <label for="patient-section" class="form-label">Section</label>
                            <select id="patient-section" name="section" class="form-select">
                                <option value="">Select Section</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                            </select>
                            <span class="form-error" id="section-error"></span>
                        </div>
                    </div>
                </fieldset>

                <!-- Contact Information -->
                <fieldset class="mb-6">
                    <legend class="text-lg font-semibold text-gray-900 mb-4">Contact Information</legend>
                    
                    <div class="form-group">
                        <label for="patient-address" class="form-label">Address</label>
                        <textarea 
                            id="patient-address" 
                            name="address"
                            class="form-textarea" 
                            placeholder="Enter complete address"
                            rows="3"
                        ></textarea>
                        <span class="form-help">Include city, state, and PIN code</span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="patient-emergency-contact" class="form-label">Emergency Contact Name</label>
                            <input 
                                type="text" 
                                id="patient-emergency-contact" 
                                name="emergencyContact"
                                class="form-input" 
                                placeholder="Parent/Guardian name"
                            >
                        </div>

                        <div class="form-group">
                            <label for="patient-emergency-phone" class="form-label">Emergency Contact Number</label>
                            <input 
                                type="tel" 
                                id="patient-emergency-phone" 
                                name="emergencyPhone"
                                class="form-input" 
                                placeholder="Emergency contact number"
                                pattern="[6-9][0-9]{9}"
                            >
                        </div>
                    </div>
                </fieldset>

                <!-- Medical History -->
                <fieldset class="mb-6">
                    <legend class="text-lg font-semibold text-gray-900 mb-4">Medical History</legend>
                    
                    <div class="form-group">
                        <label class="form-label">Known Allergies</label>
                        <div class="space-y-2">
                            <label class="flex items-center">
                                <input type="checkbox" name="allergies" value="drugs" class="form-checkbox">
                                Drug allergies
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" name="allergies" value="food" class="form-checkbox">
                                Food allergies
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" name="allergies" value="environmental" class="form-checkbox">
                                Environmental allergies
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" name="allergies" value="none" class="form-checkbox">
                                No known allergies
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="patient-allergy-details" class="form-label">Allergy Details</label>
                        <textarea 
                            id="patient-allergy-details" 
                            name="allergyDetails"
                            class="form-textarea" 
                            placeholder="Specify allergies, reactions, and severity"
                            rows="2"
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="patient-chronic-conditions" class="form-label">Chronic Conditions</label>
                        <textarea 
                            id="patient-chronic-conditions" 
                            name="chronicConditions"
                            class="form-textarea" 
                            placeholder="Any ongoing medical conditions, medications, or treatments"
                            rows="2"
                        ></textarea>
                    </div>
                </fieldset>

                <!-- Form Actions -->
                <div class="form-actions">
                    <button type="button" id="clear-form" class="btn btn-secondary">
                        <span>🗑️</span> Clear Form
                    </button>
                    <button type="button" id="save-draft" class="btn btn-outline">
                        <span>💾</span> Save Draft
                    </button>
                    <button type="submit" id="submit-form" class="btn btn-primary">
                        <span>✅</span> Register Patient
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Recent Patients -->
    <div class="card mt-6">
        <div class="card-header">
            <h3 class="card-title">Recently Registered Patients</h3>
        </div>
        <div class="card-content">
            <div id="recent-patients" class="space-y-3">
                <p class="text-gray-500">Loading recent patients...</p>
            </div>
        </div>
    </div>
</div>
